<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="../style/contacto.css">
</head>

<body>
    <header>
        <div class="logo">
            <span class="logo-at">AT</span><span class="logo-knl">.KNL</span>
        </div>
        <div class="header-icons">
            <div class="icon-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2"
                        fill="none" />
                    <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" />
                    <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" />
                    <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2" />
                </svg>
            </div>
            <div class="icon-btn active">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>
            <div class="icon-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <polygon
                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                        stroke="currentColor" stroke-width="2" fill="none" />
                </svg>
            </div>
        </div>
    </header>

    <main>
        <div>
            <div class="add-contact-box">
                <div class="add-contact-text">Agregar Nuevo Contacto</div>
            </div>

            <div class="contacts-list">
                <div class="contact-card">
                    <div class="contact-info">
                        <img src="" alt="Juan Pérez" class="avatar">
                        <div class="contact-details">
                            <div class="contact-name">Juan Pérez</div>
                            <div class="contact-phone">+502 1234-5678</div>
                        </div>
                    </div>
                    <button class="ver-btn">Ver</button>
                </div>

                <div class="contact-card">
                    <div class="contact-info">
                        <img src="" alt="María González"
                            class="avatar">
                        <div class="contact-details">
                            <div class="contact-name">María González</div>
                            <div class="contact-phone">+502 2345-6789</div>
                        </div>
                    </div>
                    <button class="ver-btn">Ver</button>
                </div>

                <div class="contact-card">
                    <div class="contact-info">
                        <img src="" alt="Carlos Rodríguez"
                            class="avatar">
                        <div class="contact-details">
                            <div class="contact-name">Carlos Rodríguez</div>
                            <div class="contact-phone">+502 3456-7890</div>
                        </div>
                    </div>
                    <button class="ver-btn">Ver</button>
                </div>

                <div class="contact-card">
                    <div class="contact-info">
                        <img src="" alt="Ana Martínez"
                            class="avatar">
                        <div class="contact-details">
                            <div class="contact-name">Ana Martínez</div>
                            <div class="contact-phone">+502 4567-8901</div>
                        </div>
                    </div>
                    <button class="ver-btn">Ver</button>
                </div>

                <div class="contact-card">
                    <div class="contact-info">
                        <img src="" alt="Luis Hernández"
                            class="avatar">
                        <div class="contact-details">
                            <div class="contact-name">Luis Hernández</div>
                            <div class="contact-phone">+502 5678-9012</div>
                        </div>
                    </div>
                    <button class="ver-btn">Ver</button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
