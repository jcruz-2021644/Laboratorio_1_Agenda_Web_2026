    <!-- Modal para la info del contacto-->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalPhoto" src="" alt="Foto del contacto">
            <h2 id="modalName"></h2>
            <p><strong>Teléfono:</strong> <span id="modalPhone"></span></p>
            <p><strong>Dirección:</strong> <span id="modalAddress"></span></p>
        </div>
    </div>
    <script src="../script/index.js"></script>

    <!-- Modal para agregar nuevo contacto (solo visual)-->
    <div id="addContactModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddContactModal()">&times;</span>
            <h2>Agregar Nuevo Contacto</h2>
            <form class="add-contact-form">
                <input type="text" placeholder="Nombre completo">
                <input type="tel" placeholder="Teléfono">
                <input type="text" placeholder="Dirección">
                <input type="file">
                <button class="cssbuttons-io-buttonC" type="button">
                    Agregar Contacto
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg"
