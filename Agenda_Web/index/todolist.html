<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contactos A.T.KNL</title>
  <link rel="icon" type="image/x-icon" href="../images/Agencia Telefonica JC.jpg" />
  <link rel="stylesheet" href="../style/todolist.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <header>
    <div class="logo">
      <a href="index.html"><span class="logo-at">AT</span><span class="logo-knl">.KNL</span></a>
    </div>
    <div class="header-icons">
      <a href="" class="icon-btn">

            d="M320.1 32C329.1 32 337.4 37.1 341.5 45.1L415 189.3L574.9 214.7C583.8 216.1 591.2 222.4 594 231C596.8 239.6 594.5 249 588.2 255.4L473.7 369.9L499 529.8C500.4 538.7 496.7 547.7 489.4 553C482.1 558.3 472.4 559.1 464.4 555L320.1 481.6L175.8 555C167.8 559.1 158.1 558.3 150.8 553C143.5 547.7 139.8 538.8 141.2 529.8L166.4 369.9L52 255.4C45.6 249 43.4 239.6 46.2 231C49 222.4 56.3 216.1 65.3 214.7L225.2 189.3L298.8 45.1C302.9 37.1 311.2 32 320.2 32zM320.1 108.8L262.3 222C258.8 228.8 252.3 233.6 244.7 234.8L119.2 254.8L209 344.7C214.4 350.1 216.9 357.8 215.7 365.4L195.9 490.9L309.2 433.3C316 429.8 324.1 429.8 331 433.3L444.3 490.9L424.5 365.4C423.3 357.8 425.8 350.1 431.2 344.7L521 254.8L395.5 234.8C387.9 233.6 381.4 228.8 377.9 222L320.1 108.8z" />
        </svg>
      </a>
    </div>
  </header>

  <main>

    <div class="task-container">
      <!-- Barra de controles -->
      <div class="task-controls">
        <div class="sort-section">
          <label for="sort-difficulty">Ordenar por:</label>
          <select id="sort-difficulty" class="sort-select">
            <option value="all">Todas</option>
            <option value="dificil">Difícil</option>
            <option value="medio">Medio</option>
            <option value="facil">Fácil</option>
          </select>
        </div>
        <button class="cssbuttons-io-buttonC" onclick="openAddContactModal()">
          Agregar Nueva Tarea
          <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
              <path
                d="M352 128C352 110.3 337.7 96 320 96C302.3 96 288 110.3 288 128L288 288L128 288C110.3 288 96 302.3 96 320C96 337.7 110.3 352 128 352L288 352L288 512C288 529.7 302.3 544 320 544C337.7 544 352 529.7 352 512L352 352L512 352C529.7 352 544 337.7 544 320C544 302.3 529.7 288 512 288L352 288L352 128z" />
            </svg>
          </div>
        </button>
      </div>
      <!-- Lista de tareas -->
      <div class="tasks-list" id="tasksList">
        <!-- Las tareas se agregarán dinámicamente aquí -->
      </div>
    </div>
  </main>

  <!-- Modal para agregar nuevo contacto-->
  <div id="addContactModal" class="modal">
    <div class="modal-content-add">
      <span class="close-add" onclick="closeAddContactModal()">&times;</span>
      <h2>Agregar Nueva Tarea</h2>
      <form id="taskForm">
        <div class="form-group">
          <label for="taskName">Nombre de la tarea:</label>
          <input type="text" id="taskName" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskStartDate">Fecha de inicio:</label>
            <div class="date-wrapper">
              <input type="date" id="taskStartDate" required>
            </div>
          </div>
          <div class="form-group">
            <label for="taskEndDate">Fecha de cierre:</label>
            <div class="date-wrapper">
              <input type="date" id="taskEndDate" required>
            </div>
          </div>
        </div>
        <div class="form-group">
          <div class="sort-section-agregar">
            <label for="taskDifficulty">Agregar dificultad: </label>
            <select id="taskDifficulty" class="sort-select-agregar">
              <option value="all">Seleccionar</option>
              <option value="dificil">Difícil</option>
              <option value="medio">Medio</option>
              <option value="facil">Fácil</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="taskObjective">Objetivo de la tarea:</label>
          <textarea id="taskObjective" rows="4" required></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn-close-modal" type="button" id="cancelAddTask">
            <p>Cancelar</p>
            <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
              <path
                d="M504.6 148.5C515.9 134.9 514.1 114.7 500.5 103.4C486.9 92.1 466.7 93.9 455.4 107.5L320 270L184.6 107.5C173.3 93.9 153.1 92.1 139.5 103.4C125.9 114.7 124.1 134.9 135.4 148.5L278.3 320L135.4 491.5C124.1 505.1 125.9 525.3 139.5 536.6C153.1 547.9 173.3 546.1 184.6 532.5L320 370L455.4 532.5C466.7 546.1 486.9 547.9 500.5 536.6C514.1 525.3 515.9 505.1 504.6 491.5L361.7 320L504.6 148.5z" />
            </svg>
          </button>
          <button class="btn-close-modal-save" type="submit">
            <p>Guardar Tarea</p>
            <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
              <path
                d="M530.8 134.1C545.1 144.5 548.3 164.5 537.9 178.8L281.9 530.8C276.4 538.4 267.9 543.1 258.5 543.9C249.1 544.7 240 541.2 233.4 534.6L105.4 406.6C92.9 394.1 92.9 373.8 105.4 361.3C117.9 348.8 138.2 348.8 150.7 361.3L252.2 462.8L486.2 141.1C496.6 126.8 516.6 123.6 530.9 134z" />
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Ver Tarea -->
  <div id="viewTaskModal" class="modal">
    <div class="modal-content-view">
      <span class="close-add" onclick="closeViewTaskModal()">&times;</span>
      <h2>Detalle de la Tarea</h2>
      <div class="task-detail">
        <div class="detail-group">
          <label>Nombre de la tarea</label>
          <p id="viewTaskName"></p>
        </div>
        <div class="detail-row">
          <div class="detail-group">
            <label>Fecha de inicio</label>
            <p id="viewTaskStart"></p>
          </div>
          <div class="detail-group">
            <label>Fecha de cierre</label>
            <p id="viewTaskEnd"></p>
          </div>
        </div>
        <div class="detail-group">
          <label>Dificultad</label>
          <span id="viewTaskDifficulty" class="difficulty-badge"></span>
        </div>
        <div class="detail-group">
          <label>Objetivo de la tarea</label>
          <p id="viewTaskObjective"></p>
        </div>
        <button class="btn-close-modal" onclick="closeViewTaskModal()">
          <p>Cerrar</p>
          <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
            <path
              d="M504.6 148.5C515.9 134.9 514.1 114.7 500.5 103.4C486.9 92.1 466.7 93.9 455.4 107.5L320 270L184.6 107.5C173.3 93.9 153.1 92.1 139.5 103.4C125.9 114.7 124.1 134.9 135.4 148.5L278.3 320L135.4 491.5C124.1 505.1 125.9 525.3 139.5 536.6C153.1 547.9 173.3 546.1 184.6 532.5L320 370L455.4 532.5C466.7 546.1 486.9 547.9 500.5 536.6C514.1 525.3 515.9 505.1 504.6 491.5L361.7 320L504.6 148.5z" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <!-- Acntualizar modal-->
  <div id="updateTaskModal" class="modal">
    <div class="modal-content-add">
      <span class="close-add" onclick="closeUpdateModal()">&times;</span>
      <h2>Actualizar Tarea</h2>
      <form id="updateTaskForm">
        <input type="hidden" id="updateTaskId">
        <div class="form-group">
          <label>Nombre de la tarea</label>
          <input type="text" id="updateTaskName">
        </div>
        <div class="detail-row">
          <div class="date-wrapper">
            <label>Fecha de inicio</label>
            <input type="date" id="updateTaskStart" required>
          </div>
          <div class="date-wrapper">
            <label>Fecha de cierre</label>
            <input type="date" id="updateTaskEnd" required>
          </div>
        </div>
        <div class="form-group">
          <div class="sort-section-agregar">
            <label for="updateTaskDifficulty">Agregar dificultad: </label>
            <select id="updateTaskDifficulty" class="sort-select-agregar">
              <option value="all">Seleccionar</option>
              <option value="dificil">Difícil</option>
              <option value="medio">Medio</option>
              <option value="facil">Fácil</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Objetivo</label>
          <textarea id="updateTaskObjective" required></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn-close-modal" type="button" onclick="closeUpdateModal()">
            <p>Cancelar</p>
            <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
              <path
                d="M504.6 148.5C515.9 134.9 514.1 114.7 500.5 103.4C486.9 92.1 466.7 93.9 455.4 107.5L320 270L184.6 107.5C173.3 93.9 153.1 92.1 139.5 103.4C125.9 114.7 124.1 134.9 135.4 148.5L278.3 320L135.4 491.5C124.1 505.1 125.9 525.3 139.5 536.6C153.1 547.9 173.3 546.1 184.6 532.5L320 370L455.4 532.5C466.7 546.1 486.9 547.9 500.5 536.6C514.1 525.3 515.9 505.1 504.6 491.5L361.7 320L504.6 148.5z" />
            </svg>
          </button>
          <button class="btn-close-modal-save" type="submit">
            <p>Actualizar</p>
            <svg xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
              <path
                d="M530.8 134.1C545.1 144.5 548.3 164.5 537.9 178.8L281.9 530.8C276.4 538.4 267.9 543.1 258.5 543.9C249.1 544.7 240 541.2 233.4 534.6L105.4 406.6C92.9 394.1 92.9 373.8 105.4 361.3C117.9 348.8 138.2 348.8 150.7 361.3L252.2 462.8L486.2 141.1C496.6 126.8 516.6 123.6 530.9 134z" />
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>
  </main>
  <script src="../script/todolist.js"></script>
</body>

</html>
